# OXN benchmark corpora
#
# Pins, not payloads. Nothing here is vendored into git -- corpora are fetched into
# `benchmarks/corpora/` (gitignored) by `python scripts/fetch_corpora.py`, which records
# resolved commit SHAs in `benchmarks/lock.json` so a run is reproducible.
#
# Three uses, and a corpus usually serves exactly one:
#   fixture   -- small, hand-checkable; golden-file and differential-oracle tests (P2)
#   threshold -- real code at scale; percentile calibration of metric thresholds (P10)
#   eval      -- agent evaluation beds (P11)
#   retrieval -- repositories whose commits *cite* their own ADRs; the external corpus
#                ADR-0006 section 5 requires, because precision@3 over OXN's own six
#                decisions is not evidence. These need `history: full`: the labels are
#                commits, and a `--depth 1` clone has none of them.

version: 1

corpora:
  # ---- eval beds -------------------------------------------------------------------
  - name: slop-code-bench
    use: eval
    url: https://github.com/SprocketLab/slop-code-bench
    ref: main
    why: >
      20 problems / 93 checkpoints, language-agnostic, measuring code erosion under
      iterative specification refinement. Tracks verbosity and structural erosion --
      exactly the Tier 1.5 signals OXN computes natively (docs/metrics.md section 3A),
      which makes it the primary bed for P11. arXiv:2603.24755.

  - name: realworld-conduit
    use: eval
    url: https://github.com/gothinkster/realworld
    ref: main
    why: >
      The Conduit API specification (19 endpoints) used by the constraint-decay study
      (arXiv:2605.06445) to layer architectural constraints L0..L3. Gives OXN a directly
      comparable setup for the constraint-budgeting arm of P11.

  # A gauntlet bed only, and deliberately a *different pin* from the `typescript-nest`
  # threshold corpus below. The bed needs a tree whose dependencies install, because a bed
  # that cannot build reports `tests FAIL` for reasons no repair caused or could fix; the
  # threshold corpus needs a tree that never moves, because the ceiling, duplication and
  # retrieval numbers were all measured against it. Those are different requirements, and
  # for a year they were served by one entry -- which is why the bed sat blocked rather
  # than re-pinned: the only fix on offer moved every recorded number.
  #
  # Pinned to a release tag rather than `master`: `--pin` re-resolves a branch, and a bed
  # whose checkout moves underneath a recorded result is the thing this file exists to stop.
  - name: typescript-nest-bed
    use: eval
    language: typescript
    url: https://github.com/nestjs/nest
    ref: v11.1.27
    why: >
      The gauntlet's TypeScript bed, and currently a pin that does not install -- kept
      because the entry is what makes the fix free when one does. Measured 2026-09-19:
      `npm ci` fails at v12.0.3 (graphql 17.0.2 against @apollo/cache-control-types'
      peer of 14.x-16.x), at v11.1.27 (@typescript-eslint/eslint-plugin 8.60.0 wanting
      parser ^8.60.0 where the lock has 8.59.3), and at v11.1.20 (EUSAGE: the workspace
      versions @nestjs/common and @nestjs/core 11.2.5 are absent from the lock). All 109
      to 110 *direct* dependencies match the lock at every tag checked, so the fault is
      transitive peers and no static check predicts it -- only the resolver finds it.

  # TypeScript's runnable gauntlet bed. nest is the better architectural subject and cannot
  # be installed (see `typescript-nest-bed` above); this one verifies, which is the property
  # a bed cannot do without. Decorator-based controllers, middlewares and interceptors, so
  # the layered contract OXN checks is still what the repository is about.
  - name: typescript-routing-controllers
    use: eval
    language: typescript
    url: https://github.com/typestack/routing-controllers
    ref: v0.11.3
    why: >
      Verified pristine on 2026-09-19: `npm ci` installs 716 packages in 2s, `npm test`
      passes 187 tests across 28 suites, and `npm run lint:check` is clean at
      --max-warnings 0. Declares no `engines` floor, so it does not need a Node newer
      than the one on the machine -- which is what ruled out adonisjs/core v7.5.0, whose
      install and typecheck pass but whose test runner requires Node >= 24.

  # ---- threshold calibration + robustness ------------------------------------------
  # Chosen for layered or explicitly modular architectures, since layer-conformance is
  # what OXN gates on. Kept deliberately small in number; breadth matters more than size.
  - name: python-httpx
    use: threshold
    language: python
    url: https://github.com/encode/httpx
    ref: master
    why: Clean layered Python library; small enough to hand-audit findings.

  - name: python-airflow
    use: threshold
    language: python
    url: https://github.com/apache/airflow
    ref: main
    why: Large real-world Python monorepo; exercises the scale path and provider packages.

  - name: typescript-nest
    use: threshold
    language: typescript
    url: https://github.com/nestjs/nest
    ref: master
    why: Explicitly layered TS with DI; a good stress test for import resolution and DI-driven dead-code false positives.

  - name: javascript-eslint
    use: threshold
    language: javascript
    url: https://github.com/eslint/eslint
    ref: main
    why: >
      The one launch language with a profile and no measurement. Pure JavaScript with no
      TypeScript build, so it exercises the `javascript` profile rather than borrowing
      TypeScript's numbers, and it is CommonJS throughout -- `require` is the only import a
      large part of this ecosystem writes, and until 2026-09-10 nothing tested that a
      required path resolves to a file in the tree. Layered the way this list asks for:
      `lib/linter`, `lib/rules`, `lib/source-code`, `lib/config`, `lib/cli-engine`. Read the
      `named` distribution knowing that `lib/rules` is several hundred files of one shape,
      which is a fact about ESLint rather than about JavaScript: one `create()` per rule,
      and `no-unused-vars.js`'s scores **579**. That architecture is most of why JavaScript's
      cognitive exceedance is 10.57% against 0.53%-3.03% everywhere else.
      `scripts/measure_ceilings.py` excludes `docs/`, `tests/bench/` and
      `tests/performance/`: those hold 1.1 MB of vendored JSHint and a minified ponyfill,
      which is somebody else's code. Excluding them moved the figure only 10.96% -> 10.57%,
      so the number is ESLint's own and the exclusion is about honesty rather than rescue.

  - name: go-kit
    use: threshold
    language: go
    url: https://github.com/go-kit/kit
    ref: master
    why: Idiomatic Go with declared layering (transport/endpoint/service).

  - name: rust-ripgrep
    use: threshold
    language: rust
    url: https://github.com/BurntSushi/ripgrep
    ref: master
    why: Multi-crate Rust workspace; exercises the `mod` tree and cross-crate resolution.

  - name: rust-tokio
    use: threshold
    language: rust
    url: https://github.com/tokio-rs/tokio
    ref: master
    why: >
      The second Rust repository `MAX_FILE_SLOC` asks for, and chosen to be unlike ripgrep
      rather than to agree with it. ripgrep exceeds the 500-line file ceiling at 20.91%, five
      times the next language, and one repository cannot separate "Rust is written this way"
      from "ripgrep is written this way" -- so a second single-author CLI tool would restate
      the same house style and read as confirmation. tokio is a many-contributor async
      runtime library: different authorship, different shape, same language. If its rate is
      also ~20% the spread is a language property; if it is not, file length is a house style
      and the per-language ceiling is the wrong idea. Either answer is worth having, which is
      what makes it the right corpus.

  - name: java-spring-petclinic
    use: threshold
    language: java
    url: https://github.com/spring-projects/spring-petclinic
    ref: main
    why: Small, canonical layered Java app; the standard teaching example for architecture conformance.

  # ---- retrieval (P8, ADR-0006 section 5) -------------------------------------------
  # Chosen by a property almost no repository has: commits that cite an ADR *while doing
  # the work it governs*, rather than while writing the ADR. Of 100 repositories with 20 or
  # more numbered ADR files, these five are what survived -- see docs/adr/0006 section 5b
  # for the funnel and the two negative results it produced.
  #
  # `adr_dir` and `license` are read by `scripts/extract_citation_labels.py`; `history:
  # full` makes the fetcher clone every commit (blobless), because a label here *is* a
  # commit and the default shallow fetch would leave none of them.
  - name: adr-querator
    use: retrieval
    history: full
    adr_dir: docs/adr
    license: none stated
    url: https://github.com/kapetan-io/querator
    ref: main
    why: >
      The cleanest sample found: 9 pairs over 25 ADRs, no agent co-authorship, and no pair
      whose text restates the cited decision's title. Its citations read as reasons --
      "the request loop may still apply a request after its caller has gone (ADR-0009)".

  - name: adr-darker
    use: retrieval
    history: full
    adr_dir: docs/adr
    license: MIT
    url: https://github.com/BrighterCommand/Darker
    ref: master
    why: >
      7 pairs over 21 ADRs, citing decisions by clause ("ADR 0014 Decisions 2 and 5").
      Every one is Claude co-authored, which is a fact about the corpus rather than a
      defect -- see the provenance split in the results.

  - name: adr-elsa-core
    use: retrieval
    history: full
    adr_dir: doc/adr
    license: MIT
    url: https://github.com/elsa-workflows/elsa-core
    ref: main
    why: 5 pairs over 28 ADRs, human-authored, large multi-ADR changes.

  - name: adr-tessellation
    use: retrieval
    history: full
    adr_dir: docs/adr
    license: Apache-2.0
    url: https://github.com/Constellation-Labs/tessellation
    ref: develop
    why: 4 pairs over 33 ADRs, human-authored, consensus-protocol decisions.

  - name: adr-agentic-dev-team
    use: retrieval
    history: full
    adr_dir: docs/adr
    license: MIT
    url: https://github.com/bdfinst/agentic-dev-team
    ref: main
    why: >
      76 of the 101 pairs, over 42 ADRs, and the reason the pooled set reaches a usable
      size at all. Also the most confounded: agent-written, squash-merged so one commit
      cites up to six decisions, and 45 of its pairs restate the cited decision's wording.
      Included deliberately -- OXN exists to govern agents, so agent-written commits are
      arguably the population rather than the confound -- and every result is reported
      with and without it.
