# OXN — architecture and quality invariants for OXN itself.
#
# Dogfooding is the point: if this configuration is annoying to work under, it is not
# shippable to anyone else. Every value here is a default from `oxn.thresholds` unless a
# comment says otherwise, and the reasoning for each default lives beside it in that file.

# How many repairs an agent may spend on one violation before the hook stops asking and
# tells it to escalate instead (ADR-0003 section 4). Set to the default explicitly, because
# a bound nobody can see in the config is a bound nobody expects when it fires.
retry_budget: 3

ceilings:
  cognitive_complexity: 12   # the headline gate; chosen over SonarSource's 15, idea.md's 8
  cyclomatic_complexity: 10
  max_nesting_depth: 4
  parameter_count: 5
  function_sloc: 60
  file_sloc: 500
  # The class aggregates. A ratchet before a ceiling: they catch the two shred shapes
  # `shredding` cannot see (public helper names, helpers with a second caller), and the
  # classes already above them are baselined rather than condemned. See thresholds.py.
  methods_per_class: 12
  weighted_methods_per_class: 25

# OXN's own architecture. The order is outermost first: a layer may depend on every layer
# after it and on none before it.
#
# `graph/indexer.py` sits in `orchestration` rather than `graph`, and that placement was
# corrected *by this contract*. The first run flagged `graph/indexer.py -> metrics/engine.py`
# as the graph layer reaching into analysis. The import is deliberate -- the indexer measures
# in the same pass that parses, because parsing twice would double the hook's cost -- but
# that makes the indexer an orchestrator, not a data structure. The rule was right and the
# layer assignment was wrong; the file moved layers rather than the contract being weakened.
layers:
  # `review.py`, `writers.py`, `calls.py`, `doctor.py`, `calibration.py` and `__main__.py`
  # were in no layer until 2026-09-10, which is the `rules/*` mistake described below
  # happening a second time: an unassigned source means every import it makes is skipped by
  # the check, so six modules were building call graphs and running git under no contract at
  # all. Naming them cost zero violations -- they were already well-behaved, merely
  # ungoverned, which is exactly why nobody noticed.
  #
  # Still deliberately unassigned: `config.py`, `render.py`, `thresholds.py`, `languages.py`,
  # `llm.py` and `profiles/*`. Those are foundation -- every layer reads them and they read
  # almost nothing back -- and a `foundation` layer at the inner end would immediately flag
  # `config.py -> graph/contracts.py`. That edge deserves a decision (move `Contract`, or
  # accept it) and not a layer assignment chosen to avoid making one.
  # `server.py` is a surface, not orchestration: it decodes a request, calls the same
  # functions `_app.py` calls, and encodes the answer. It holds no analysis of its own.
  surfaces: ["src/oxn/cli.py", "src/oxn/_app.py", "src/oxn/__main__.py", "src/oxn/report.py", "src/oxn/calls.py", "src/oxn/check.py", "src/oxn/review.py", "src/oxn/writers.py", "src/oxn/init.py", "src/oxn/server.py", "src/oxn/health.py", "src/oxn/doctor.py", "src/oxn/calibration.py"]
  orchestration: ["src/oxn/graph/indexer.py"]
  # `sources.py` is graph, not orchestration: finding source files is not orchestrating
  # anything, and every tier needs the walk. It lived beside `Indexer` until this contract
  # objected three times over.
  # `rules/*` was in no layer until 2026-09-04, and the layered check skips edges whose
  # source is unassigned -- so every import the rule engine made was ungoverned. `context/*`
  # (ADR-0006) is analysis for the same reason `metrics/*` is: it reads the graph and the
  # rules, and the surfaces read it.
  # `retry.py` is analysis for the same reason `context/*` is: the surfaces call it, it
  # calls nothing back, and it holds policy rather than presentation. It imports no part of
  # OXN at all -- it deals in path strings and floats -- which is what lets a module the
  # gate itself depends on sit under the contract instead of beside it.
  analysis: ["src/oxn/metrics/*", "src/oxn/resolve/*", "src/oxn/volume/*", "src/oxn/vcs/*", "src/oxn/scip/*", "src/oxn/rules/*", "src/oxn/context/*", "src/oxn/retry.py"]
  graph: ["src/oxn/graph/*"]
  # Not part of the layered contract below -- tests may reach anywhere, that is their job --
  # but named so they can carry their own ceilings.
  tests: ["tests/*"]

contracts:
  - name: surfaces-analysis-graph
    kind: layered
    order: [surfaces, orchestration, analysis, graph]

# Fixtures are source files on purpose -- a hand-built shred is supposed to look bad.
advisory:
  - "tests/fixtures/*"

# The benchmark corpora are fetched third-party trees (benchmarks/manifest.yaml), gitignored
# and present only on machines that ran `scripts/fetch_corpora.py`. Measuring them alongside
# OXN's own code makes every repository-wide number depend on who fetched what: before this
# line, a bare `oxn check --deep` here reported 1,083 violations in other people's code.
# `tests/test_rules_corpus.py` drops this exclusion explicitly -- it is the one caller whose
# whole subject is those trees.
exclude:
  - "benchmarks/corpora/*"
