name: CI

# Deliberately manual-only. Correctness for this project is established locally by
# `python scripts/check.py --all`, which runs the same lanes; GitHub Actions is kept here
# so the pipeline is documented and can be switched on by adding `push:` triggers.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # The default lane runs pure Python only. Differential-test oracles (radon, lizard,
      # complexipy, ...) live in a separate lane so they can never drift into being
      # runtime dependencies -- see ADR-0001.
      - name: Test
        # Corpus tests (`slow`) skip automatically when the corpora are not fetched;
        # the `corpus` job below runs them against the real repositories.
        run: pytest -m "not oracle and not llm"

      - name: Type check
        if: matrix.python-version == '3.12'
        run: mypy

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  gate:
    # OXN gating OXN. `scripts/check.py` has run this locally since P2.5, but the declared
    # pipeline did not -- so the one lane whose whole subject is "the gate works on a real
    # repository" was the lane CI never ran.
    #
    # `--deep` is the CI scope on purpose: the `PostToolUse` hook answers ceilings and the
    # layer contracts one file's own imports can settle, and only the whole graph can add
    # edges *into* a file and import cycles. Exit 2 is violations; exit 1 is OXN failing to
    # run, which must never be read as a pass.
    #
    # No retry budget here: `oxn.yaml` sets one for agent sessions, and it is keyed on a
    # `session_id` that CI does not send, so this run always reports rather than halting.
    name: gate (oxn on oxn)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m oxn check --deep src tests scripts

  e2e:
    # The lane that installs OXN rather than importing it. Every other job runs against the
    # working tree, where the whole repository is on the path and `pyproject.toml` is barely
    # consulted -- so a module missing from the wheel, an undeclared dependency or a console
    # script that does not resolve are invisible to all of them.
    #
    # Opt-in locally (`OXN_E2E=1 pytest -m e2e`) because it costs a build and a virtualenv;
    # here it is not optional. The tests self-skip without the variable, which means leaving
    # it out would make this job pass by running nothing.
    name: e2e (install, use, remove)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: End to end
        env:
          OXN_E2E: "1"
        run: pytest -m e2e

  corpus:
    # Phase exit criteria against real repositories: parse throughput, cache-hit ratio on
    # a no-op re-run, and the grammar error rate. Needs ~150k LOC of pinned sources, so it
    # runs on demand and on a schedule rather than on every push.
    name: corpus (exit criteria)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/fetch_corpora.py --name python-httpx --name typescript-nest
      - run: pytest -m slow

  oracle:
    # Differential tests against the free third-party tools OXN deliberately does not
    # depend on. Nightly and on demand: slow, and needs toolchains beyond Python.
    name: differential oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev,oracle]"
      # eslint-plugin-sonarjs is LGPL-3.0. It runs here as a subprocess and is never linked
      # into or distributed with OXN, which keeps it licence-clean under ADR-0001.
      - name: Install the JavaScript oracle
        working-directory: tests/oracles
        run: npm install --no-save --no-audit --no-fund eslint@9 eslint-plugin-sonarjs@4
      # dependency-cruiser is the import-graph oracle for JavaScript and goes on PATH rather
      # than into tests/oracles: the test invokes `depcruise` by name, as a user would.
      - name: Install the import-graph oracle
        run: npm install -g --no-audit --no-fund dependency-cruiser@18.3.1 typescript@5
      - name: Fetch corpora
        run: >
          python scripts/fetch_corpora.py
          --name python-httpx --name javascript-eslint --name java-spring-petclinic
      # jdeps ships with the JDK; petclinic's pom enforces 17 as a minimum. This sits *after*
      # the fetch on purpose: `cache: maven` keys on `**/pom.xml`, and corpora are cloned by
      # the step above, so higher up the glob matches nothing and the cache is dead at best.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # jdeps reads bytecode, so the Java oracle needs the corpus *compiled* -- corpora are
      # cloned, never built. The test fails rather than skips on stale output, so this must
      # run; `test-compile` stops short of running petclinic's tests, which is all jdeps needs.
      - name: Compile the Java corpus for jdeps
        working-directory: benchmarks/corpora/java-spring-petclinic
        run: ./mvnw -B -q test-compile
      - run: pytest -m oracle
        env:
          OXN_SONARJS_DIR: ${{ github.workspace }}/tests/oracles
