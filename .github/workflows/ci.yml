name: CI

on:
  push:
    branches: [master, "docs/**", "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # The default lane runs pure Python only. Differential-test oracles (radon, lizard,
      # complexipy, ...) live in a separate lane so they can never drift into being
      # runtime dependencies -- see ADR-0001.
      - name: Test
        run: pytest -m "not oracle"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .

  oracle:
    # Differential tests against the free third-party tools OXN deliberately does not
    # depend on. Nightly and on demand: slow, and needs toolchains beyond Python.
    name: differential oracles
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev,oracle]"
      - run: pytest -m oracle
