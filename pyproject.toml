[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oxn"
description = "Local neuro-symbolic architecture and quality gatekeeper for LLM coding agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mustafa Arslan" }]
keywords = ["mcp", "static-analysis", "software-architecture", "code-quality", "llm-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]

# Runtime dependencies are governed by ADR-0001: free, permissive, pip-installable, offline.
# Dependencies enter at the phase that needs them -- adding one early makes the import-graph
# guard test (tests/test_import_guard.py) meaningless.
dependencies = [
    "typer>=0.12",                      # human-facing CLI; never on the hook fast path
    "pydantic>=2.7",                    # config schema
    "pyyaml>=6.0",                      # oxn.yaml
    "rich>=13.7",                       # terminal output; never on the hook fast path
    "tree-sitter>=0.25",                # parsing (>=0.25 for the QueryCursor API)
    "tree-sitter-language-pack>=1.15",  # 371 grammars, MIT, fetched lazily on first use
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]
# CI-only differential-test oracles. NEVER runtime dependencies -- see ADR-0001 and
# docs/metrics.md section 9. Installed only in the CI oracle lane.
oracle = [
    "radon>=6.0",
    "lizard>=1.17",
    "complexipy>=2.0",
    "grimp>=3.0",       # import-graph oracle for Python
    "networkx>=3.0",    # graph-algorithm oracle; never a runtime dependency
    "vulture>=2.11",    # dead-code oracle
]

[project.scripts]
oxn = "oxn.cli:main"

[project.urls]
Repository = "https://github.com/mustafarslan/oxn"
Roadmap = "https://github.com/mustafarslan/oxn/blob/master/ROADMAP.md"

[tool.hatch.version]
path = "src/oxn/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/oxn"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "benchmarks", "ROADMAP.md", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "oracle: differential tests against third-party tools (radon, lizard, ...). CI-only lane; these tools are never runtime dependencies.",
    "slow: tests that clone or scan large corpora.",
    "llm: tests that call a language model through Ollama. Opt-in; skipped when the host is unreachable.",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Fetched corpora are other people's code, and 31 MB of it. `.gitignore` covers this in a
# working tree, but ruff only honours gitignore inside a git repository -- so a copy of the
# tree without `.git` (a dogfood sandbox, an extracted archive) would lint all of httpx.
extend-exclude = ["benchmarks/corpora"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares defaults via calls in the signature; that is the library's idiom, not a bug.
"src/oxn/_app.py" = ["B008"]
# The transliteration fixtures are one line of real source per language. Wrapping them to
# fit a column limit would obscure the very thing the test compares.
"tests/test_polyglot.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["oxn"]
strict = true
